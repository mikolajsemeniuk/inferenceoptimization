# llama.cpp servers. Model and flags come from the Makefile / environment, e.g.
#   MODEL=Qwen3-8B-Q4_K_M.gguf EXTRA="-ctk q8_0 -ctv q8_0" docker compose up -d llm
x-llama: &llama
  build: .
  image: inferenceoptimizationbench-llama
  user: "${UID_GID:-1000:1000}"
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # main chat model (reference: Qwen3-8B Q8_0)
  llm:
    <<: *llama
    ports: ["8101:8080"]
    volumes: ["./models:/models:ro", "./slots:/slots"]
    command: >
      -m /models/${MODEL:-Qwen3-8B-Q8_0.gguf} -ngl 99 -c ${CTX:-65536} -np ${NP:-8}
      --slot-save-path /slots --metrics ${EXTRA:-}

  # second chat model for cascades and verification (cheaper: smaller or more quantized)
  llm2:
    <<: *llama
    ports: ["8102:8080"]
    volumes: ["./models:/models:ro", "./slots:/slots"]
    command: >
      -m /models/${MODEL2:-Qwen3-1.7B-Q8_0.gguf} -ngl 99 -c ${CTX2:-32768} -np ${NP2:-8}
      --slot-save-path /slots --metrics ${EXTRA2:-}

  # embedding model
  embed:
    <<: *llama
    ports: ["8103:8080"]
    volumes: ["./models:/models:ro"]
    command: >
      -m /models/${EMBED:-bge-m3-Q8_0.gguf} -ngl 99 -c 8192 -b 8192 -ub 8192 -np 4 --embeddings --pooling cls
